[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "avalign"
version = "0.1.0.dev0"
description = "Audio-visual cross-modal contrastive alignment, synchronization and retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "You Tao" }]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/HuggingNobody/avalign"

[tool.setuptools.packages.find]
where = ["src"]
